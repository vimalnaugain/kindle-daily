# What the morning job collects. Edit freely; the Kindle shows categories in
# this order. Everything here is public: put nothing personal in this file.
#
# Feed types:
#   rss          any RSS/Atom feed
#   google_news  a Google News RSS feed (links are Google redirects, so these
#                mostly count as "coverage" for ranking; full text comes from
#                a direct feed covering the same story)
#   hn           Hacker News front page (needs `keywords` to filter by topic)
#
# weight: how much a feed's front-page position counts (default 1.0)
# max_age_hours: ignore older items (per category; default 36)

edition:
  title: Daily Brief
  timezone: Asia/Kolkata
  stories_per_category: 15   # the Kindle shows every story of the topics you pick
  max_per_source: 2          # keep the 5 stories from at least 3 outlets
  user_agent: "Mozilla/5.0 (compatible; daily-brief/1.0)"
  blocked_sources: [The Motley Fool, Zacks, InvestorPlace, Benzinga, Yahoo Finance, Cricbuzz, IPO Watch]
  # pages that aren't news stories, in every topic
  exclude: ["live score", "scorecard", "price band", "ipo date", "price forecast", "horoscope",
            "lottery result", "schedule, latest news", "gold rate today", "petrol price today"]

# News topics the Kindle can show. None is shown until you pick topics on
# the Kindle (Menu > News topics); then every story of those topics shows.
categories:
  - id: top
    title: Top stories
    short: Top
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en", weight: 1.5 }
      - { type: rss, name: The Hindu, url: "https://www.thehindu.com/news/feeder/default.rss" }
      - { type: rss, name: NDTV, url: "https://feeds.feedburner.com/ndtvnews-top-stories" }
      - { type: rss, name: BBC, url: "https://feeds.bbci.co.uk/news/rss.xml" }

  - id: business
    title: Business
    short: Business
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: Mint, url: "https://www.livemint.com/rss/companies" }
      - { type: rss, name: The Hindu, url: "https://www.thehindu.com/business/feeder/default.rss" }
      - { type: rss, name: BBC, url: "https://feeds.bbci.co.uk/news/business/rss.xml" }

  - id: technology
    title: Technology
    short: Tech
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: The Verge, url: "https://www.theverge.com/rss/index.xml" }
      - { type: rss, name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index" }
      - { type: rss, name: TechCrunch, url: "https://techcrunch.com/feed/" }

  - id: science
    title: Science
    short: Science
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/headlines/section/topic/SCIENCE?hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: Quanta Magazine, url: "https://www.quantamagazine.org/feed/", weight: 1.5 }
      - { type: rss, name: New Scientist, url: "https://www.newscientist.com/feed/home/" }
      - { type: rss, name: BBC, url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml" }

  - id: health
    title: Health
    short: Health
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/headlines/section/topic/HEALTH?hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: NPR, url: "https://feeds.npr.org/1128/rss.xml" }
      - { type: rss, name: BBC, url: "https://feeds.bbci.co.uk/news/health/rss.xml" }

  - id: sports
    title: Sports
    short: Sports
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: The Hindu, url: "https://www.thehindu.com/sport/feeder/default.rss" }
      - { type: rss, name: BBC, url: "https://feeds.bbci.co.uk/sport/rss.xml" }

  - id: entertainment
    title: Entertainment
    short: Films & TV
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: The Hindu, url: "https://www.thehindu.com/entertainment/feeder/default.rss" }
      - { type: rss, name: BBC, url: "https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml" }
  - id: ai
    short: AI
    title: New in AI
    exclude: ["stocks? to buy", "buy before", "price prediction"]   # skip investing clickbait
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/search?q=%22artificial+intelligence%22+OR+%22AI+model%22+when:1d&hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: TechCrunch, url: "https://techcrunch.com/category/artificial-intelligence/feed/" }
      - { type: rss, name: The Verge, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml" }
      - { type: rss, name: MIT Technology Review, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed" }
      - { type: rss, name: VentureBeat, url: "https://venturebeat.com/category/ai/feed/" }
      - type: hn
        name: Hacker News
        keywords: [ai, llm, gpt, claude, gemini, openai, anthropic, model, models, neural, agent, agents, machine learning, deepmind, transformer, diffusion]

  - id: content_design
    short: Design
    title: Content Design
    max_age_hours: 168       # a slower field: look back a week
    feeds:
      - { type: rss, name: Nielsen Norman Group, url: "https://www.nngroup.com/feed/rss/", weight: 1.5 }
      - { type: rss, name: UX Collective, url: "https://uxdesign.cc/feed" }
      - { type: rss, name: Smashing Magazine, url: "https://www.smashingmagazine.com/feed/" }
      - { type: rss, name: A List Apart, url: "https://alistapart.com/main/feed/" }
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/search?q=%22content+design%22+OR+%22UX+writing%22+OR+%22content+strategy%22+when:7d&hl=en-IN&gl=IN&ceid=IN:en" }

  - id: india
    short: Delhi
    title: Delhi & India
    boost: [delhi, ncr, noida, gurugram, gurgaon]   # Delhi stories rank a little higher
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/headlines/section/topic/NATION?hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: google_news, name: Google News Delhi, url: "https://news.google.com/rss/search?q=Delhi+when:1d&hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: The Hindu, url: "https://www.thehindu.com/news/national/feeder/default.rss" }
      - { type: rss, name: The Indian Express, url: "https://indianexpress.com/section/cities/delhi/feed/" }
      - { type: rss, name: Hindustan Times, url: "https://www.hindustantimes.com/feeds/rss/cities/delhi-news/rssfeed.xml" }
      - { type: rss, name: NDTV, url: "https://feeds.feedburner.com/ndtvnews-india-news" }

  - id: world
    short: World
    title: International
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/headlines/section/topic/WORLD?hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: BBC, url: "https://feeds.bbci.co.uk/news/world/rss.xml" }
      - { type: rss, name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml" }
      - { type: rss, name: The Guardian, url: "https://www.theguardian.com/world/rss" }
      - { type: rss, name: NPR, url: "https://feeds.npr.org/1004/rss.xml" }
      - { type: rss, name: DW, url: "https://rss.dw.com/rdf/rss-en-world" }

  - id: markets
    short: Stocks
    title: Stocks
    exclude: ["multibagger", "penny stock", "stocks? to buy", "buy or sell", "sell or hold"]
    feeds:
      - { type: google_news, name: Google News, url: "https://news.google.com/rss/search?q=Sensex+OR+Nifty+OR+stocks+when:1d&hl=en-IN&gl=IN&ceid=IN:en" }
      - { type: rss, name: ET Markets, url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms" }
      - { type: rss, name: Mint, url: "https://www.livemint.com/rss/markets" }
      - { type: rss, name: Moneycontrol, url: "https://www.moneycontrol.com/rss/marketreports.xml" }

# A free long read for the dashboard: Wikipedia's featured article of the day.
article_of_the_day:
  wikipedia_featured: true

# Market numbers are no longer shown on the Kindle; the Stocks topic keeps
# the market news. To bring the numbers back into the brief, restore a
# `markets:` section (see git history).

# Long reads: at least 5 unread on the Kindle, new ones every morning.
reads:
  new_per_day: 5
  keep: 30            # pieces kept in the pool (the Kindle hides the ones you've read)
  min_words: 900
  sources:
    - { type: links, name: Read Something Great, url: "https://www.readsomethinggreat.com/" }
    - { type: rss, name: Aeon, url: "https://aeon.co/feed.rss" }
    - { type: rss, name: Psyche, url: "https://psyche.co/feed" }
    - { type: rss, name: The Marginalian, url: "https://www.themarginalian.org/feed/" }
    - { type: rss, name: Longreads, url: "https://longreads.com/feed/" }
    - { type: rss, name: Nautilus, url: "https://nautil.us/feed/" }
    - { type: rss, name: Paul Graham, url: "http://www.aaronsw.com/2002/feeds/pgessays.rss" }

