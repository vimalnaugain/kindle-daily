# Temporary: build the brief from this branch and report, without publishing.
name: Preview brief
on:
  push:
    branches: [job-preview]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r job/requirements.txt
      - name: Build (report only)
        working-directory: job
        run: python -W ignore -m daily.build --config config.yml --out ../site --previous https://vimalnaugain.github.io/kindle-daily/ 2>&1 | grep -v '^  ok ' | grep -v '^[0-9]*\\. '
      - name: Sizes
        run: du -sh site site/news site/reads; ls -la site/news; ls site/reads | wc -l
