# Every morning: builds the Daily Brief (news, markets) and publishes it to
# GitHub Pages together with the Kindle app's install packages.
#
#   https://<user>.github.io/<repo>/brief.json        today's edition
#   https://<user>.github.io/<repo>/app/manifest.json  KPM repository for the app
#   https://<user>.github.io/<repo>/app/daily-kindle.zip  USB install (KUAL)
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Then run this workflow once from the Actions tab.
name: Daily brief

on:
  schedule:
    - cron: "47 23 * * *"   # 05:17 IST (GitHub may start it a few minutes late)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["job/**", "app/**", ".github/workflows/daily-brief.yml"]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q luajit libluajit-5.1-dev zip
      - name: App tests (desktop emulator)
        run: |
          make -C native
          luajit tests/run_tests.lua
      # The Kindle binary only changes with the C sources or the build script.
      - id: cache
        uses: actions/cache@v4
        with:
          path: app/build/kindle/daily
          key: kindle-bin-${{ hashFiles('app/native/*.c', 'app/tools/build_kindle.sh') }}
      - name: Cross-compile the Kindle binary
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install -q ziglang==0.13.0
          ZIG="python3 -m ziglang" tools/build_kindle.sh
      - name: Run the app's code on the ARM binary (qemu)
        if: github.event_name != 'schedule'
        run: |
          sudo apt-get install -y -q qemu-user
          file build/kindle/daily | grep -q "ARM"
          qemu-arm build/kindle/daily tests/arm_smoke.lua
      - name: Package (KPM repository and USB zip)
        run: |
          VERSION="$(tr -d '\n' < VERSION)" tools/package_kpm.sh
          tools/package_kindle.sh
          cp build/daily-kindle.zip build/kpm-repo/
      - uses: actions/upload-artifact@v4
        with:
          name: app-site
          path: app/build/kpm-repo
          retention-days: 1

  build:
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - run: pip install -r job/requirements.txt
      - name: Tests
        working-directory: job
        run: python -m pytest -q -p no:warnings
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the brief
        working-directory: job
        env:
          PREVIOUS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        # One retry: a flaky site or a crash shouldn't cost a morning's edition.
        run: |
          python -W ignore -m daily.build --config config.yml --out ../site --report "$GITHUB_STEP_SUMMARY" \
            || { echo "Build failed; retrying in 60 s"; sleep 60; rm -rf ../site;
                 python -W ignore -m daily.build --config config.yml --out ../site --report "$GITHUB_STEP_SUMMARY"; }
      - uses: actions/download-artifact@v4
        with:
          name: app-site
          path: site/app
      - name: Landing page
        run: cp pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub pauses scheduled workflows in public repos after 60 days without
  # activity. A tiny commit on the 1st of each month keeps this one running.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Monthly keep-alive commit
        run: |
          [ "$(TZ=Asia/Kolkata date +%d)" = "01" ] || exit 0
          TZ=Asia/Kolkata date +%Y-%m-%d > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep the daily schedule active" && git push
