# Builds the Daily Brief every morning and publishes it to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Then run this workflow once from the Actions tab.
name: Daily brief

on:
  schedule:
    - cron: "47 23 * * *"   # 05:17 IST (GitHub may start it a few minutes late)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["job/**", ".github/workflows/daily-brief.yml"]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - run: pip install -r job/requirements.txt
      - name: Tests
        working-directory: job
        run: python -m pytest -q -p no:warnings
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the brief
        working-directory: job
        env:
          PREVIOUS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        # One retry: a flaky site or a crash shouldn't cost a morning's edition.
        run: |
          python -W ignore -m daily.build --config config.yml --out ../site --report "$GITHUB_STEP_SUMMARY" \
            || { echo "Build failed; retrying in 60 s"; sleep 60; rm -rf ../site;
                 python -W ignore -m daily.build --config config.yml --out ../site --report "$GITHUB_STEP_SUMMARY"; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub pauses scheduled workflows in public repos after 60 days without
  # activity. A tiny commit on the 1st of each month keeps this one running.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Monthly keep-alive commit
        run: |
          [ "$(TZ=Asia/Kolkata date +%d)" = "01" ] || exit 0
          TZ=Asia/Kolkata date +%Y-%m-%d > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep the daily schedule active" && git push
